services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-handoffly}
      MYSQL_USER: ${MYSQL_USER:-handoffly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-handoffly}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-handoffly}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-handoffly}
      DB_PASSWORD: ${MYSQL_PASSWORD:-handoffly}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-bytes}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-logging}
      MAIL_FROM: ${MAIL_FROM:-no-reply@handoffly.local}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      RECIPIENT_LINK_BASE_URL: ${RECIPIENT_LINK_BASE_URL:-http://localhost:5173/r}
      SUPPORT_MAILBOX: ${SUPPORT_MAILBOX:-support@handoffly.local}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      PAYMENT_DEMO_ENABLED: ${PAYMENT_DEMO_ENABLED:-false}
      PASSWORD_RESET_LINK_BASE_URL: ${PASSWORD_RESET_LINK_BASE_URL:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      JOBS_SCHEDULER_ENABLED: ${JOBS_SCHEDULER_ENABLED:-true}
      JOBS_DEFAULT_TIMEZONE: ${JOBS_DEFAULT_TIMEZONE:-Asia/Kolkata}
      JOBS_EXPIRY_WINDOW_DAYS: ${JOBS_EXPIRY_WINDOW_DAYS:-7}
      SUPPORT_STAFF_NAME: ${SUPPORT_STAFF_NAME:-}
      SUPPORT_STAFF_EMAIL: ${SUPPORT_STAFF_EMAIL:-}
      SUPPORT_STAFF_PASSWORD: ${SUPPORT_STAFF_PASSWORD:-}
      SUPPORT_STAFF_ROLE: ${SUPPORT_STAFF_ROLE:-ADMIN}
      STAFF_JWT_EXPIRATION_MINUTES: ${STAFF_JWT_EXPIRATION_MINUTES:-480}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STORAGE_LOCAL_DIR: /app/storage-data
    ports:
      - "8080:8080"
    volumes:
      - storage-data:/app/storage-data

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Baked at build time; see frontend/Dockerfile.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"

volumes:
  mysql-data:
  storage-data:
