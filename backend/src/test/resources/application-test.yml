spring:
  datasource:
    url: jdbc:h2:mem:handoffly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

handoffly:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long-for-hs256-ok
    expiration-minutes: 60
    issuer: handoffly-test
  recipient:
    link-base-url: http://localhost:5173/r
    token-ttl-days: 30
  mail:
    provider: logging
    from: no-reply@handoffly.test
  storage:
    type: local
    local-dir: ./target/test-storage
    max-file-size-bytes: 5242880
    allowed-content-types: image/png,image/jpeg,application/pdf,text/plain,text/csv
  support:
    mailbox: support-desk@handoffly.test
    phone: "+1 555 0100"
  cors:
    allowed-origins: http://localhost:5173
