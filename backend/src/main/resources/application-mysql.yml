# Explicit MySQL profile. Activated with -Dspring-boot.run.profiles=mysql, which takes
# precedence over any SPRING_PROFILES_ACTIVE env var, guaranteeing a MySQL connection.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/handoffly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:handoffly}
    password: ${DB_PASSWORD:handoffly}
    driver-class-name: com.mysql.cj.jdbc.Driver
