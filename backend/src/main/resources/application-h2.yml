# Optional convenience profile for running the app locally WITHOUT MySQL/Docker.
# MySQL remains the default and production database; this uses a file-backed H2 in
# MySQL-compatibility mode so the same Flyway migrations apply. Enable with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:file:./data/handoffly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

handoffly:
  jwt:
    secret: dev-only-h2-profile-secret-key-at-least-32-bytes-long-ok
