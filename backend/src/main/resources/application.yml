spring:
  application:
    name: handoffly
  config:
    # Optional, git-ignored local overrides (e.g. SMTP settings) for running from an IDE or Maven.
    # Absent file = no effect. Real environment variables still win. See README "Real email delivery".
    import: "optional:file:./.env.local[.properties],optional:file:../.env.local[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/handoffly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:handoffly}
    password: ${DB_PASSWORD:handoffly}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Flyway is the single source of truth for the schema (see docs/DECISIONS.md).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # The mail server is optional (dev uses the logging sender); don't fail health on it.
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.handoffly: ${LOG_LEVEL:INFO}

handoffly:
  jwt:
    # 256-bit+ secret. MUST be overridden via env in any real deployment.
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-please-rotate-32b+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
    # Support staff sessions (a separate identity from customers) are shorter.
    staff-expiration-minutes: ${STAFF_JWT_EXPIRATION_MINUTES:480}
    issuer: handoffly
  recipient:
    # Base URL of the frontend recipient review page; {token} is appended.
    link-base-url: ${RECIPIENT_LINK_BASE_URL:http://localhost:5173/r}
    token-ttl-days: ${RECIPIENT_TOKEN_TTL_DAYS:30}
  mail:
    provider: ${MAIL_PROVIDER:logging}   # logging | smtp
    from: ${MAIL_FROM:no-reply@handoffly.local}
    # Optional: path to your own copy of the Proof-of-Handoff email template (re-read on every send).
    pdf-template-file: ${MAIL_PDF_TEMPLATE_FILE:}
  storage:
    type: ${STORAGE_TYPE:local}          # local (S3 impl can be added later)
    local-dir: ${STORAGE_LOCAL_DIR:./storage-data}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:15728640}   # 15 MiB
    allowed-content-types: >-
      image/png,image/jpeg,image/webp,image/gif,application/pdf,
      text/plain,text/csv,
      application/msword,
      application/vnd.openxmlformats-officedocument.wordprocessingml.document,
      application/vnd.ms-excel,
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  support:
    # New-ticket notices go here; also the general contact address on the public site.
    mailbox: ${SUPPORT_MAILBOX:support@handoffly.local}
    # Shown only to customers whose plan includes direct calls. Blank = no call option is shown.
    phone: ${SUPPORT_PHONE:}
    # Controlled provisioning of a support staff account (see README). Blank = nothing is created.
    provision:
      name: ${SUPPORT_STAFF_NAME:}
      email: ${SUPPORT_STAFF_EMAIL:}
      password: ${SUPPORT_STAFF_PASSWORD:}
      role: ${SUPPORT_STAFF_ROLE:ADMIN}
  payment:
    # DEMO provider: anyone can "pay" for a plan without real money. Development/testing only — keep false in production.
    demo-enabled: ${PAYMENT_DEMO_ENABLED:false}
    redeem-ttl-hours: ${PAYMENT_REDEEM_TTL_HOURS:24}
  cors:
    # Customer app (5173) and support portal (5175) in development; list real origins in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175}
